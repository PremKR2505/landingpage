<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello there</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@1,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #06060a;
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 320px; 
            overflow-x: hidden;
            position: relative;
        }

        
        .backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('./bg1.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
            filter: blur(6px) brightness(40%) contrast(110%);
        }

        .backdrop::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 50%, transparent 10%, #06060a 90%);
        }

        /* MAIN LAYOUT */
        .left-panel {
            z-index: 10;
            position: relative;
            padding: 10vh 0 10vh 10vw;
        }

        .frame {
            display: flex;
            align-items: flex-start; 
            gap: 55px;
        }

        /*  PROFILE AVATAR FRAME */
        .avatar-box {
            width: 120px;
            height: 160px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #000;
            padding: 6px;
            box-shadow: -20px 20px 50px rgba(0,0,0,0.9);
            margin-top: 12px;
            animation: paneFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .avatar-box img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%) contrast(130%);
        }

        .content { max-width: 460px; }

        .intro-group {
            margin-bottom: 40px;
        }

        .intro-group h1 {
            font-family: 'Times New Roman', serif;
            font-size: 96px;
            line-height: 0.75;
            letter-spacing: -6px;
            text-transform: uppercase;
            color: #ffffff;
            transform: scaleX(0.72);
            transform-origin: left center;
            text-shadow: -5px 5px 0px #06060a;
            
            /* Entry Animation */
            opacity: 0;
            filter: blur(10px);
            animation: textReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .intro-group p {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 15px;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
            margin-top: 16px;
            letter-spacing: -0.1px;
            
            /* Entry Animation */
            opacity: 0;
            filter: blur(5px);
            animation: textReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        /* RAZOR-SHARP LINK TILES */
        nav { display: flex; flex-direction: column; gap: 14px; }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            text-decoration: none;
            background: rgba(4,5,10,0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 24px 30px;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.06);
            border-left: 4px solid #ffffff;
            
            /*  transitions */
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Staggered entry initial states */
            opacity: 0;
            transform: translateX(-20px);
            filter: blur(4px);
        }

        /* Staggered link timing rules */
        .row:nth-child(1) { animation: linkEntrap 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }
        .row:nth-child(2) { animation: linkEntrap 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
        .row:nth-child(3) { animation: linkEntrap 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }
        .row:nth-child(4) { animation: linkEntrap 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; }

        .row:hover {
            background: #ffffff;
            color: #000000;
            transform: translateX(8px);
            box-shadow: -8px 8px 0px rgba(255,255,255,0.1);
        }

        .num { opacity: 0.3; margin-right: 15px; font-family: 'Space Mono', monospace; transition: opacity 0.2s; }
        .row:hover .num { opacity: 1; }
        .arrow { font-size: 14px; }

        /* ANIMATIONS */
        @keyframes textReveal {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        @keyframes linkEntrap {
            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        @keyframes paneFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive scaling adjustment */
        @media(max-width: 900px) {
            body { grid-template-columns: 1fr; }
            .sidebar-hud { display: none; }
            .left-panel { padding: 8vh 5vw; }
            .frame { flex-direction: column; gap: 30px; }
            .intro-group h1 { font-size: 64px; }
        }
    </style>
</head>
<body>

    <!-- Parallax Environmental Canvas -->
    <div class="backdrop"></div>

    <!-- Core Interface Layout -->
    <div class="left-panel">
        <div class="frame">
            
            <!-- Avatar Picture Segment -->
            <div class="avatar-box">
                <img src="profile.jpg" alt="Nadeko calling">
            </div>

            <!-- Typography Cluster -->
            <main class="content">
                <div class="intro-group">
                    <h1>Prem KR</h1>
                    <p>Hey there, it's nice to meet cha'.</p>
                    <p>I am Prem, some might know me as pk. This is a list of my socials and stuff, you can check them out if you are interested.</p>
                </div>
                
                <nav class="links-stack">
                    <a href="https://myanimelist.net/profile/PremKR" target="_blank" class="row">
                        <span><span class="num">01</span>MYANIMELIST // PremKR</span>
                        <span class="arrow">➞</span>
                    </a>
                    <a href="https://infinitebacklog.net/users/PKay255" target="_blank" class="row">
                        <span><span class="num">02</span>infinitebacklog // PKay255</span>
                        <span class="arrow">➞</span>
                    </a>
                    <a href="https://steamcommunity.com/profiles/76561198759522689" target="_blank" class="row">
                        <span><span class="num">03</span>Steam // pklegendary25</span>
                        <span class="arrow">➞</span>
                    </a>
                    <a href="https://github.com/PremKR2505" target="_blank" class="row">
                        <span><span class="num">04</span>GitHub // PremKR2505</span>
                        <span class="arrow">➞</span>
                    </a>
                </nav>
            </main>

        </div>
    </div>

</body>
</html>
